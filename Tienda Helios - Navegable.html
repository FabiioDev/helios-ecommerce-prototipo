<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda Helios – Prototipo navegable</title>
  <style>
    :root {
      --bg: #f4f3ee;
      --surface: #ffffff;
      --surface-muted: #faf9f6;
      --border: #e5e3dc;
      --text: #1f1e1d;
      --text-muted: #6b6a68;
      --accent: #d97706;
      --accent-soft: #fef3c7;
      --accent-text: #92400e;
      --sidebar-w: 270px;
      --topbar-h: 56px;
      --radius: 10px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: margin-left 0.2s ease;
      z-index: 20;
    }

    .app.sidebar-hidden .sidebar {
      margin-left: calc(var(--sidebar-w) * -1);
    }

    .brand {
      height: var(--topbar-h);
      padding: 0 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }

    .brand-dot {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      font-weight: 700;
      display: grid;
      place-items: center;
      font-size: 14px;
    }

    .brand-title {
      font-weight: 600;
      font-size: 14px;
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .nav {
      flex: 1;
      overflow-y: auto;
      padding: 14px 10px;
    }

    .nav-group-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      padding: 10px 10px 6px;
    }

    .nav-item {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      padding: 9px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font: inherit;
      margin-bottom: 2px;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .nav-item:hover {
      background: var(--surface-muted);
    }

    .nav-item.active {
      background: var(--accent-soft);
      color: var(--accent-text);
      font-weight: 600;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 6px;
      background: #efede7;
      color: #575654;
      flex-shrink: 0;
    }

    .nav-item.active .badge {
      background: var(--accent);
      color: #fff;
    }

    .nav-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Main area */
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .topbar {
      height: var(--topbar-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    .topbar-left, .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .current-title {
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-left: 4px;
    }

    .step-counter {
      font-size: 12px;
      color: var(--text-muted);
      padding: 0 6px;
      white-space: nowrap;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      height: 32px;
      padding: 0 10px;
      border-radius: 7px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .btn:hover:not(:disabled) {
      background: var(--surface-muted);
      border-color: #d2cfc7;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn.active {
      background: var(--accent-soft);
      border-color: #f59e0b;
      color: var(--accent-text);
      font-weight: 600;
    }

    .divider {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 2px;
    }

    /* Viewport */
    .viewport {
      flex: 1;
      overflow: auto;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .stage-shell {
      position: relative;
      background: #fff;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .screen-frame {
      display: none;
      border: 0;
      background: #fff;
      transform-origin: top left;
    }

    .screen-frame.active {
      display: block;
    }

    @media (max-width: 820px) {
      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        box-shadow: 4px 0 24px rgba(0,0,0,0.12);
      }
      .hide-sm { display: none; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-dot">H</div>
        <div>
          <div class="brand-title">Tienda Helios</div>
          <div class="brand-sub">Prototipo navegable</div>
        </div>
      </div>

      <nav class="nav" id="nav"></nav>

      <div class="sidebar-footer">
        <span>Atajos: ← / →</span>
        <span>7 vistas</span>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn" id="toggleSidebar" title="Mostrar u ocultar menú">☰</button>
          <span class="badge" id="currentCode">P-01</span>
          <span class="current-title" id="currentTitle">Inicio</span>
        </div>

        <div class="topbar-right">
          <button class="btn" id="prevBtn" title="Pantalla anterior (←)">← <span class="hide-sm">Anterior</span></button>
          <span class="step-counter" id="stepCounter">1 / 7</span>
          <button class="btn" id="nextBtn" title="Siguiente pantalla (→)"><span class="hide-sm">Siguiente</span> →</button>

          <div class="divider hide-sm"></div>

          <button class="btn active hide-sm" id="fitBtn" title="Ajustar al ancho disponible">Ajustar</button>
          <button class="btn hide-sm" id="zoomOutBtn" title="Alejar">−</button>
          <span class="step-counter hide-sm" id="zoomLabel">100%</span>
          <button class="btn hide-sm" id="zoomInBtn" title="Acercar">+</button>

          <div class="divider hide-sm"></div>

          <a class="btn hide-sm" id="openDirect" href="#" target="_blank" rel="noopener" title="Abrir esta pantalla en una pestaña nueva">↗</a>
        </div>
      </header>

      <main class="viewport" id="viewport">
        <div class="stage-shell" id="stageShell"></div>
      </main>
    </div>
  </div>

  <script>
    const SCREENS = [
      {
        id: "p-01",
        group: "Flujo de compra",
        code: "P-01",
        title: "Inicio",
        src: "./d7e594b9-865e-49e8-a407-2c3d0947b0d3.html",
        width: 1280,
        height: 1900
      },
      {
        id: "p-03",
        group: "Flujo de compra",
        code: "P-03",
        title: "Ficha de producto",
        src: "./4eaa7b22-0b25-49d7-9e55-969f61b9cfe0.html",
        width: 1280,
        height: 2200
      },
      {
        id: "p-04",
        group: "Flujo de compra",
        code: "P-04",
        title: "Carrito",
        src: "./dad943fd-517e-463b-b2a2-d6864d0ffa19.html",
        width: 1280,
        height: 1250
      },
      {
        id: "p-05",
        group: "Flujo de compra",
        code: "P-05",
        title: "Checkout",
        src: "./6d364618-0f1e-4f1c-9ff6-363d29373ae1.html",
        width: 1280,
        height: 1750
      },
      {
        id: "p-06",
        group: "Flujo de compra",
        code: "P-06",
        title: "Confirmación y seguimiento",
        src: "./b8b368fb-06ce-4ce5-8e4d-ed84566da861.html",
        width: 1280,
        height: 1350
      },
      {
        id: "r-01",
        group: "Reportes",
        code: "R-01",
        title: "Resumen de ventas",
        src: "./02a34290-139d-46c2-ab01-dafcb4dab304.html",
        width: 1280,
        height: 1400
      },
      {
        id: "r-03",
        group: "Reportes",
        code: "R-03",
        title: "Clientes y Club Helios",
        src: "./4ab75065-0818-453b-a95d-8c1199962fe3.html",
        width: 1280,
        height: 1450
      }
    ];

    const app = document.getElementById("app");
    const nav = document.getElementById("nav");
    const viewport = document.getElementById("viewport");
    const stageShell = document.getElementById("stageShell");
    const currentCode = document.getElementById("currentCode");
    const currentTitle = document.getElementById("currentTitle");
    const stepCounter = document.getElementById("stepCounter");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const fitBtn = document.getElementById("fitBtn");
    const zoomOutBtn = document.getElementById("zoomOutBtn");
    const zoomInBtn = document.getElementById("zoomInBtn");
    const zoomLabel = document.getElementById("zoomLabel");
    const openDirect = document.getElementById("openDirect");
    const toggleSidebar = document.getElementById("toggleSidebar");

    let currentIndex = 0;
    let fitMode = true;
    let manualScale = 1;
    const frames = new Map();

    // Render navigation grouped by section
    const groups = [...new Set(SCREENS.map(s => s.group))];
    groups.forEach(groupName => {
      const label = document.createElement("div");
      label.className = "nav-group-label";
      label.textContent = groupName;
      nav.appendChild(label);

      SCREENS.forEach((screen, idx) => {
        if (screen.group !== groupName) return;
        const btn = document.createElement("button");
        btn.className = "nav-item";
        btn.dataset.index = idx;
        btn.innerHTML = `<span class="badge">${screen.code}</span><span class="nav-label">${screen.title}</span>`;
        btn.addEventListener("click", () => selectScreen(idx));
        nav.appendChild(btn);
      });
    });

    function getOrCreateFrame(screen) {
      if (frames.has(screen.id)) return frames.get(screen.id);
      const iframe = document.createElement("iframe");
      iframe.className = "screen-frame";
      iframe.src = screen.src;
      iframe.title = `${screen.code} ${screen.title}`;
      iframe.width = screen.width;
      iframe.height = screen.height;
      iframe.style.width = `${screen.width}px`;
      iframe.style.height = `${screen.height}px`;
      stageShell.appendChild(iframe);
      frames.set(screen.id, iframe);
      return iframe;
    }

    function applyScale() {
      const screen = SCREENS[currentIndex];
      const iframe = frames.get(screen.id);
      if (!iframe) return;

      let scale = manualScale;
      if (fitMode) {
        const availableWidth = viewport.clientWidth - 48;
        scale = Math.min(1, Math.max(0.25, availableWidth / screen.width));
      }

      iframe.style.transform = `scale(${scale})`;
      stageShell.style.width = `${Math.round(screen.width * scale)}px`;
      stageShell.style.height = `${Math.round(screen.height * scale)}px`;
      zoomLabel.textContent = `${Math.round(scale * 100)}%`;
      fitBtn.classList.toggle("active", fitMode);
    }

    function selectScreen(index, updateHash = true) {
      currentIndex = Math.max(0, Math.min(SCREENS.length - 1, index));
      const screen = SCREENS[currentIndex];

      // Update active nav item
      nav.querySelectorAll(".nav-item").forEach(btn => {
        btn.classList.toggle("active", Number(btn.dataset.index) === currentIndex);
      });

      // Toggle visible iframe
      frames.forEach(f => f.classList.remove("active"));
      const activeFrame = getOrCreateFrame(screen);
      activeFrame.classList.add("active");

      // Update topbar
      currentCode.textContent = screen.code;
      currentTitle.textContent = screen.title;
      stepCounter.textContent = `${currentIndex + 1} / ${SCREENS.length}`;
      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === SCREENS.length - 1;
      openDirect.href = screen.src;

      viewport.scrollTo({ top: 0, behavior: "smooth" });
      applyScale();

      if (updateHash) {
        history.replaceState(null, "", `#${screen.id}`);
      }
    }

    // Controls
    prevBtn.addEventListener("click", () => selectScreen(currentIndex - 1));
    nextBtn.addEventListener("click", () => selectScreen(currentIndex + 1));

    toggleSidebar.addEventListener("click", () => {
      app.classList.toggle("sidebar-hidden");
      setTimeout(applyScale, 210);
    });

    fitBtn.addEventListener("click", () => {
      fitMode = true;
      applyScale();
    });

    zoomOutBtn.addEventListener("click", () => {
      if (fitMode) {
        const current = parseInt(zoomLabel.textContent, 10) / 100;
        manualScale = current;
        fitMode = false;
      }
      manualScale = Math.max(0.4, +(manualScale - 0.1).toFixed(2));
      applyScale();
    });

    zoomInBtn.addEventListener("click", () => {
      if (fitMode) {
        const current = parseInt(zoomLabel.textContent, 10) / 100;
        manualScale = current;
        fitMode = false;
      }
      manualScale = Math.min(1.5, +(manualScale + 0.1).toFixed(2));
      applyScale();
    });

    window.addEventListener("resize", applyScale);

    window.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      if (e.key === "ArrowLeft") selectScreen(currentIndex - 1);
      if (e.key === "ArrowRight") selectScreen(currentIndex + 1);
    });

    window.addEventListener("hashchange", () => {
      const id = location.hash.replace("#", "");
      const idx = SCREENS.findIndex(s => s.id === id);
      if (idx !== -1) selectScreen(idx, false);
    });

    // Init from URL hash or first screen
    const initialId = location.hash.replace("#", "");
    const initialIdx = SCREENS.findIndex(s => s.id === initialId);
    selectScreen(initialIdx !== -1 ? initialIdx : 0, false);
  </script>
</body>
</html>
